<rect x="0" y="0" width="1810" height="1000" fill="#ffffff"/>
<text x="24" y="44" font-size="30" font-weight="bold" fill="#1b2230">WB-700 - preliminary power distribution</text>
<text x="24" y="76" font-size="17" fill="#555d6b">Strictly onboard battery power. Every actuator (drive, steering, camera servo) is downstream of the e-stop contactor; the logic rail stays</text>
<text x="24" y="98" font-size="17" fill="#555d6b">alive so the robot can report and log the stop. Values are Phase 1 design targets; fuse and wire sizes are confirmed in Phase 2.</text>
<rect x="25" y="130" width="375" height="805" rx="14" fill="#fffaf0" stroke="#c98a00" stroke-width="2"/>
<text x="39" y="154" font-size="16" font-weight="bold" fill="#c98a00">SOURCE + ISOLATION</text>
<rect x="430" y="130" width="1355" height="340" rx="14" fill="#f3fbf6" stroke="#1f8a4c" stroke-width="2"/>
<text x="444" y="154" font-size="16" font-weight="bold" fill="#1f8a4c">LOGIC BRANCH (always on while armed)</text>
<rect x="430" y="495" width="1355" height="440" rx="14" fill="#fff6f6" stroke="#c62828" stroke-width="2" stroke-dasharray="9 6"/>
<text x="444" y="519" font-size="16" font-weight="bold" fill="#c62828">ACTUATOR BRANCH (cut by the e-stop)</text>
